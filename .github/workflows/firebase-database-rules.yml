name: Deploy EARTH WEATHER Firebase database rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Authenticate with Firebase service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EARTHWEATHERCHANNEL }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy the named Firestore and Realtime Database rules
        env:
          CLOUDSDK_CORE_PROJECT: earthweatherchannel
        run: |
          set -euo pipefail
          npm install --global firebase-tools
          firebase deploy --only firestore:earthweather,database --project earthweatherchannel --non-interactive
