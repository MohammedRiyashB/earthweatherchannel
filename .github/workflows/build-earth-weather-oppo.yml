name: Build Earth Weather from OPPO UI UX source
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Uifprweather.zip"
      - "backend/app/oppo_compat.py"
      - "backend/app/main.py"
      - ".github/workflows/build-earth-weather-oppo.yml"
permissions:
  contents: read
jobs:
  build-full-oppo-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Download Apktool
        run: |
          curl -fL --retry 3 --retry-delay 2 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          java -jar apktool.jar --version
      - name: Reconstruct and decode supplied OPPO UI UX package
        run: |
          mkdir -p input
          unzip -q Uifprweather.zip -d input
          test -f input/OppoWeather2/AndroidManifest.xml
          test -f input/OppoWeather2/resources.arsc
          (cd input/OppoWeather2 && zip -q -r ../oppo-original.apk .)
          java -Xmx5g -jar apktool.jar d -f input/oppo-original.apk -o decoded
      - name: Rebrand app and route its weather data to EARTH WEATHER
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root = Path("decoded")
          old = "com.coloros.weather2"
          new = "com.bmrinc.earthweather"

          # Update package/authority references in decoded textual resources and Smali.
          text_ext = {".xml", ".smali", ".yml", ".yaml", ".json", ".properties", ".txt", ".html", ".cfg", ".ini"}
          changed = 0
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding="utf-8")
                  changed += 1

          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          m = tree.getroot()
          m.set("package", new)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Keep the original resources and their translation variants, changing only identity labels.
          label_replacements = {
              "app_name": "Earth Weather",
              "weather_about": "About Earth Weather",
              "user_agreement": "Earth Weather User Agreement",
              "privacy_policy_weather_service": "Earth Weather Privacy Notice",
              "export_personal_service_protection_policy": "Personal Service Privacy Notice",
          }
          for p in (root / "res").glob("values*/strings.xml"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for name, value in label_replacements.items():
                  pattern = re.compile(r'(<string\s+name="' + re.escape(name) + r'"[^>]*>)(.*?)(</string>)', re.S)
                  s, n = pattern.subn(lambda m: m.group(1) + value + m.group(3), s)
              p.write_text(s, encoding="utf-8")

          # Direct the original app's Host abstraction at the user's own API host.
          host = root / "smali/com/oplus/weather/service/network/host/Host.smali"
          if not host.exists():
              host = next(root.glob("smali*/com/oplus/weather/service/network/host/Host.smali"))
          hs = host.read_text()
          method = """.method public getAddress()Ljava/lang/String;
              .locals 1
              const-string v0, "https://earth-weather-api.onrender.com"
              return-object v0
          .end method"""
          hs, count = re.subn(r"(?ms)^\.method public getAddress\(\)Ljava/lang/String;.*?^\.end method", method, hs, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch Host.getAddress()")
          host.write_text(hs)

          # The user's API is not the vendor's encrypted service: pass the normal JSON request through.
          crypto = next(root.glob("smali*/com/heytap/weather/interceptor/CryptoInterceptor.smali"))
          cs = crypto.read_text()
          passthrough = """.method public intercept(Lokhttp3/Interceptor$Chain;)Lokhttp3/Response;
              .locals 1
              invoke-interface {p1}, Lokhttp3/Interceptor$Chain;->request()Lokhttp3/Request;
              move-result-object v0
              invoke-interface {p1, v0}, Lokhttp3/Interceptor$Chain;->proceed(Lokhttp3/Request;)Lokhttp3/Response;
              move-result-object v0
              return-object v0
          .end method"""
          cs, count = re.subn(r"(?ms)^\.method public intercept\(Lokhttp3/Interceptor\$Chain;\)Lokhttp3/Response;.*?^\.end method", passthrough, cs, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch CryptoInterceptor.intercept()")
          crypto.write_text(cs)

          # Disable only the OPPO-specific cryptographic handshake; preserve the app's request headers.
          manager = next(root.glob("smali*/com/oplus/weather/WeatherDataClientManager.smali"))
          ms = manager.read_text()
          init_method = """.method public static cryptoInit()V
              .locals 1
              sget-boolean v0, Lcom/oplus/weather/WeatherDataClientManager;->cryptoIsInit:Z
              if-nez v0, :cond_0
              const/4 v0, 0x1
              sput-boolean v0, Lcom/oplus/weather/WeatherDataClientManager;->cryptoIsInit:Z
              invoke-static {}, Lcom/oplus/weather/WeatherDataClientManager;->setRequestHeader()V
              :cond_0
              return-void
          .end method"""
          ms, count = re.subn(r"(?ms)^\.method public static cryptoInit\(\)V.*?^\.end method", init_method, ms, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch WeatherDataClientManager.cryptoInit()")
          manager.write_text(ms)

          # Modify only user-visible Android string resources and legal HTML.
          # Never replace vendor tokens in Smali descriptors, class names, method names,
          # resource identifiers, or XML attribute names: those are implementation symbols.
          import html
          import xml.etree.ElementTree as ET
          import re

          def map_vendor_url(value: str) -> str:
              def _map(match):
                  url = match.group(0)
                  lower = url.lower()
                  if any(x in lower for x in ("agreement", "terms", "user-agreement")):
                      return "https://earthweatherchannel.web.app/terms-and-conditions"
                  if any(x in lower for x in ("third", "service", "personal")):
                      return "https://earthweatherchannel.web.app/data-usage-policy"
                  if any(x in lower for x in ("privacy", "policy", "opush")):
                      return "https://earthweatherchannel.web.app/privacy-policy"
                  return "https://earthweatherchannel.web.app/"
              pattern = re.compile(r"https?://(?:[A-Za-z0-9-]+\.)*(?:oppo|oplus|heytap|oneplus|realme)\.(?:com|cn)(?:/[^\s\"'<>]*)?", re.I)
              return pattern.sub(_map, value)

          def clean_visible_text(value):
              if not value:
                  return value
              # Android string resources can also hold class names and opaque SDK tokens.
              # Preserve those implementation values; change only human-readable copy/URLs.
              stripped = value.strip()
              if re.fullmatch(r"(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+[A-Za-z_$][A-Za-z0-9_$]*", stripped):
                  return value
              if re.fullmatch(r"[A-Za-z0-9+/=]{32,}", stripped):
                  return value
              if len(stripped) > 45 and not re.search(r"\\s", stripped) and not stripped.lower().startswith(("http://", "https://")):
                  return value
              value = map_vendor_url(value)
              replacements = [
                  ("Guangdong OPPO Mobile Telecommunications Corp., Ltd.", "BMR INC. — EARTH WEATHER CHANNEL"),
                  ("Guangdong OPPO", "BMR INC."),
                  ("OPPO ADN", "EARTH WEATHER"),
                  ("OPPO Weather", "Earth Weather"),
                  ("Oppo Weather", "Earth Weather"),
                  ("OPPO weather", "Earth Weather"),
                  ("Oppo Market", "Earth Weather"),
                  ("ColorOS Weather", "Earth Weather"),
                  ("ColorOS", "EARTH WEATHER"),
                  ("HeyTap", "EARTH WEATHER"),
                  ("heytap", "earthweather"),
                  ("OPlus", "EARTH WEATHER"),
                  ("Oplus", "EARTH WEATHER"),
              ]
              for old_text, new_text in replacements:
                  value = value.replace(old_text, new_text)
              value = re.sub(r"(?i)\bOPPO\b", "EARTH WEATHER", value)
              value = re.sub(r"(?i)\bOppo\b", "Earth Weather", value)
              return value

          # Make the built-in legal hyperlinks point to the published BMR INC. pages.
          uri_map = {
              "bootreg://private.policy": "https://earthweatherchannel.web.app/privacy-policy",
              "bootreg://export.private.policy": "https://earthweatherchannel.web.app/data-usage-policy",
              "bootreg://user.agreement": "https://earthweatherchannel.web.app/terms-and-conditions",
              "@string/url_www_opush_01": "https://earthweatherchannel.web.app/privacy-policy",
          }

          values_dir = root / "res"
          for p in values_dir.glob("values*/strings.xml"):
              try:
                  tree = ET.parse(p)
              except (ET.ParseError, OSError) as exc:
                  raise SystemExit(f"Invalid Android strings resource {p}: {exc}")
              changed_here = False
              for node in tree.iter():
                  if node.text:
                      before = node.text
                      after = clean_visible_text(before)
                      for old_uri, new_uri in uri_map.items():
                          after = after.replace(old_uri, new_uri)
                      if after != before:
                          node.text = after
                          changed_here = True
                  if node.tail:
                      before = node.tail
                      after = clean_visible_text(before)
                      for old_uri, new_uri in uri_map.items():
                          after = after.replace(old_uri, new_uri)
                      if after != before:
                          node.tail = after
                          changed_here = True
                  # URL attributes are safe to rewrite; leave resource IDs and class names intact.
                  for key, val in list(node.attrib.items()):
                      if isinstance(val, str) and (val.startswith("http://") or val.startswith("https://")):
                          after = clean_visible_text(val)
                          if after != val:
                              node.set(key, after)
                              changed_here = True
              if changed_here:
                  tree.write(p, encoding="utf-8", xml_declaration=True)

          # Handle any HTML/TXT legal resources without touching Smali or other program files.
          for base in (root / "assets", root / "res"):
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in {".html", ".htm", ".txt"}:
                      continue
                  try:
                      raw = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = clean_visible_text(raw)
                  for old_uri, new_uri in uri_map.items():
                      updated = updated.replace(old_uri, new_uri)
                  if p.name.startswith("weather_third_party_info") and p.suffix.lower() in {".html", ".htm"}:
                      updated = """<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Weather — Third-party information</title></head><body><h1>Earth Weather third-party information</h1><p>For current third-party services, SDKs, data handling and privacy disclosures used by EARTH WEATHER, read the published BMR INC. disclosure.</p><p><a href="https://earthweatherchannel.web.app/data-usage-policy">Earth Weather Data Usage and Third-party Information</a></p><p><a href="https://earthweatherchannel.web.app/privacy-policy">Earth Weather Privacy Policy</a></p></body></html>"""
                  if updated != raw:
                      p.write_text(updated, encoding="utf-8")

          # Replace only the legacy browser's vendor host string with our website host.
          base_web = next(root.glob("smali*/com/oplus/weather/plugin/webview/BaseWebActivity.smali"), None)
          if base_web:
              body = base_web.read_text(encoding="utf-8")
              body = body.replace('const-string/jumbo v4, "oppo"', 'const-string/jumbo v4, "earthweatherchannel.web.app"')
              base_web.write_text(body, encoding="utf-8")

          # Disable the bundled OPPO index-ad client at its boundary. The weather UI
          # remains unchanged; its ad data request receives an empty string and makes no vendor request.
          ad_ext = next(root.glob("smali*/com/oplus/weather/service/network/client/IndexAdClientExt.smali"), None)
          if ad_ext is None:
              raise SystemExit("IndexAdClientExt.smali not found; refusing to leave OPPO ad client enabled")
          ad_body = ad_ext.read_text(encoding="utf-8")
          method = ".method public final getIndexAdData(Ljava/util/Map;)Ljava/lang/String;"
          a = ad_body.find(method)
          if a < 0:
              raise SystemExit("IndexAdClientExt.getIndexAdData method not found")
          z = ad_body.find(".end method", a)
          if z < 0:
              raise SystemExit("IndexAdClientExt.getIndexAdData method terminator not found")
          z += len(".end method")
          safe_method = """.method public final getIndexAdData(Ljava/util/Map;)Ljava/lang/String;
              .locals 1
              const-string v0, ""
              return-object v0
          .end method"""
          ad_body = ad_body[:a] + safe_method + ad_body[z:]
          ad_ext.write_text(ad_body, encoding="utf-8")

          # The app's ad-support feature flag is false in the reference build already.
          # Keep that vendor ad path disabled; do not rewrite internal com.oplus/com.heytap namespaces.
          feature = next(root.glob("smali*/com/oplus/weather/utils/AppFeatureUtils.smali"), None)
          if feature is None:
              raise SystemExit("AppFeatureUtils.smali not found")
          feature_body = feature.read_text(encoding="utf-8")
          if "isSupportOplusAd_delegate$lambda$5" not in feature_body:
              raise SystemExit("Could not verify OPPO ad feature gate")
          # The upstream feature gate already returns false; preserve it verbatim.

          # Validate the resource XML after all edits.
          for p in values_dir.glob("values*/strings.xml"):
              ET.parse(p)

          # Fail if OEM branding or vendor legal links remain in user-visible text nodes.
          visible_hits = []
          forbidden = re.compile(r"(?i)Guangdong OPPO|\bOPPO\b|\bColorOS\b|\bHeyTap\b|\bOPlus\b|https?://[^\s\"'<>]*(?:oppo|oplus|heytap|oneplus|realme)\.(?:com|cn)")
          for p in values_dir.glob("values*/strings.xml"):
              tree = ET.parse(p)
              for node in tree.iter():
                  for candidate in (node.text, node.tail):
                      if not candidate:
                          continue
                      stripped = candidate.strip()
                      if re.fullmatch(r"(?:[A-Za-z_$][A-Za-z0-9_$]*\.)+[A-Za-z_$][A-Za-z0-9_$]*", stripped):
                          continue
                      if re.fullmatch(r"[A-Za-z0-9+/=]{32,}", stripped):
                          continue
                      if len(stripped) > 45 and not re.search(r"\\s", stripped) and not stripped.lower().startswith(("http://", "https://")):
                          continue
                      if forbidden.search(candidate):
                          visible_hits.append(f"{p}:{node.tag}:{candidate[:90]}")
          if visible_hits:
              raise SystemExit("OEM branding/vendor links remain in visible strings: " + " | ".join(visible_hits[:20]))

          # Record the intended product identity in the build workspace.
          (Path("earth-weather-build.properties")).write_text(
              "applicationId=com.bmrinc.earthweather\nappName=Earth Weather\napiBase=https://earth-weather-api.onrender.com\n"
          )
          print(f"Updated package references in {changed} files.")
          PY
      - name: Build original app resources and bytecode with Apktool
        run: |
          java -Xmx6g -jar apktool.jar b decoded -f -o earth-weather-unsigned.apk
          test -s earth-weather-unsigned.apk
          ls -lh earth-weather-unsigned.apk
      - name: Align and sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -v -keystore earthweather-debug.jks -storepass android -alias earthweather -keypass android -dname "CN=Earth Weather,O=BMR Inc,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f -p 4 earth-weather-unsigned.apk earth-weather-aligned.apk
          "$BT/apksigner" sign --ks earthweather-debug.jks --ks-key-alias earthweather --ks-pass pass:android --key-pass pass:android --out EarthWeather.apk earth-weather-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs EarthWeather.apk
          "$BT/aapt" dump badging EarthWeather.apk | tee apk-badging.txt
          grep -q "package: name='com.bmrinc.earthweather'" apk-badging.txt
          grep -q "application-label:'Earth Weather'" apk-badging.txt
          test "$(stat -c%s EarthWeather.apk)" -gt 20000000
          sha256sum EarthWeather.apk | tee apk-sha256.txt
      - name: Upload full UI APK
        uses: actions/upload-artifact@v4
        with:
          name: earth-weather-full-oppo-ui-debug
          path: |
            EarthWeather.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
