name: Build Earth Weather from OPPO UI UX source
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Uifprweather.zip"
      - "backend/app/oppo_compat.py"
      - "backend/app/main.py"
      - ".github/workflows/build-earth-weather-oppo.yml"
permissions:
  contents: read
jobs:
  build-full-oppo-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Download Apktool
        run: |
          curl -fL --retry 3 --retry-delay 2 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          java -jar apktool.jar --version
      - name: Reconstruct and decode supplied OPPO UI UX package
        run: |
          mkdir -p input
          unzip -q Uifprweather.zip -d input
          test -f input/OppoWeather2/AndroidManifest.xml
          test -f input/OppoWeather2/resources.arsc
          (cd input/OppoWeather2 && zip -q -r ../oppo-original.apk .)
          java -Xmx5g -jar apktool.jar d -f input/oppo-original.apk -o decoded
      - name: Rebrand app and route its weather data to EARTH WEATHER
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root = Path("decoded")
          old = "com.coloros.weather2"
          new = "com.bmrinc.earthweather"

          # Update package/authority references in decoded textual resources and Smali.
          text_ext = {".xml", ".smali", ".yml", ".yaml", ".json", ".properties", ".txt", ".html", ".cfg", ".ini"}
          changed = 0
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if old in s:
                  p.write_text(s.replace(old, new), encoding="utf-8")
                  changed += 1

          manifest = root / "AndroidManifest.xml"
          tree = ET.parse(manifest)
          m = tree.getroot()
          m.set("package", new)
          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Keep the original resources and their translation variants, changing only identity labels.
          label_replacements = {
              "app_name": "Earth Weather",
              "weather_about": "About Earth Weather",
              "user_agreement": "Earth Weather User Agreement",
              "privacy_policy_weather_service": "Earth Weather Privacy Notice",
              "export_personal_service_protection_policy": "Personal Service Privacy Notice",
          }
          for p in (root / "res").glob("values*/strings.xml"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for name, value in label_replacements.items():
                  pattern = re.compile(r'(<string\s+name="' + re.escape(name) + r'"[^>]*>)(.*?)(</string>)', re.S)
                  s, n = pattern.subn(lambda m: m.group(1) + value + m.group(3), s)
              p.write_text(s, encoding="utf-8")

          # Direct the original app's Host abstraction at the user's own API host.
          host = root / "smali/com/oplus/weather/service/network/host/Host.smali"
          if not host.exists():
              host = next(root.glob("smali*/com/oplus/weather/service/network/host/Host.smali"))
          hs = host.read_text()
          method = """.method public getAddress()Ljava/lang/String;
              .locals 1
              const-string v0, "https://earth-weather-api.onrender.com"
              return-object v0
          .end method"""
          hs, count = re.subn(r"(?ms)^\.method public getAddress\(\)Ljava/lang/String;.*?^\.end method", method, hs, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch Host.getAddress()")
          host.write_text(hs)

          # The user's API is not the vendor's encrypted service: pass the normal JSON request through.
          crypto = next(root.glob("smali*/com/heytap/weather/interceptor/CryptoInterceptor.smali"))
          cs = crypto.read_text()
          passthrough = """.method public intercept(Lokhttp3/Interceptor$Chain;)Lokhttp3/Response;
              .locals 1
              invoke-interface {p1}, Lokhttp3/Interceptor$Chain;->request()Lokhttp3/Request;
              move-result-object v0
              invoke-interface {p1, v0}, Lokhttp3/Interceptor$Chain;->proceed(Lokhttp3/Request;)Lokhttp3/Response;
              move-result-object v0
              return-object v0
          .end method"""
          cs, count = re.subn(r"(?ms)^\.method public intercept\(Lokhttp3/Interceptor\$Chain;\)Lokhttp3/Response;.*?^\.end method", passthrough, cs, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch CryptoInterceptor.intercept()")
          crypto.write_text(cs)

          # Disable only the OPPO-specific cryptographic handshake; preserve the app's request headers.
          manager = next(root.glob("smali*/com/oplus/weather/WeatherDataClientManager.smali"))
          ms = manager.read_text()
          init_method = """.method public static cryptoInit()V
              .locals 1
              sget-boolean v0, Lcom/oplus/weather/WeatherDataClientManager;->cryptoIsInit:Z
              if-nez v0, :cond_0
              const/4 v0, 0x1
              sput-boolean v0, Lcom/oplus/weather/WeatherDataClientManager;->cryptoIsInit:Z
              invoke-static {}, Lcom/oplus/weather/WeatherDataClientManager;->setRequestHeader()V
              :cond_0
              return-void
          .end method"""
          ms, count = re.subn(r"(?ms)^\.method public static cryptoInit\(\)V.*?^\.end method", init_method, ms, count=1)
          if count != 1:
              raise SystemExit("Could not safely patch WeatherDataClientManager.cryptoInit()")
          manager.write_text(ms)

          # Replace user-visible vendor identity and legal destinations with EARTH WEATHER's published pages.
          brand_replacements = {
              "Guangdong OPPO Mobile Telecommunications Corp., Ltd.": "BMR INC. — EARTH WEATHER CHANNEL",
              "Guangdong OPPO": "BMR INC.",
              "OPPO Weather": "Earth Weather",
              "OPPO weather": "Earth Weather",
              "Oppo Weather": "Earth Weather",
              "ColorOS Weather": "Earth Weather",
              "ColorOS": "Earth Weather",
              "OPPO": "EARTH WEATHER",
              "OPlus": "EARTH WEATHER",
              "Oplus": "EARTH WEATHER",
              "HeyTap": "EARTH WEATHER",
              "heytap": "earthweather",
              "oppo.com/privacy-feedback": "earthweatherchannel.web.app/privacy-policy",
              "privacy.oppo.com": "earthweatherchannel.web.app/privacy-policy",
              "https://www.oppo.com": "https://earthweatherchannel.web.app",
              "https://oppo.com": "https://earthweatherchannel.web.app",
          }
          legal_routes = {
              "weather_user_agreement": "https://earthweatherchannel.web.app/terms-and-conditions",
              "user_agreement": "https://earthweatherchannel.web.app/terms-and-conditions",
              "privacy_policy": "https://earthweatherchannel.web.app/privacy-policy",
              "privacy_notice": "https://earthweatherchannel.web.app/privacy-policy",
              "personal_service": "https://earthweatherchannel.web.app/data-usage-policy",
              "third_party": "https://earthweatherchannel.web.app/data-usage-policy",
          }
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              original = s
              for old_text, new_text in brand_replacements.items():
                  s = s.replace(old_text, new_text)
              if p.name.startswith("weather_user_agreement") or p.name.startswith("user_agreement"):
                  s = s.replace("https://earthweatherchannel.web.app", legal_routes["weather_user_agreement"])
              if p.name.startswith("weather_privacy") or p.name.startswith("privacy_policy"):
                  s = s.replace("https://earthweatherchannel.web.app", legal_routes["privacy_policy"])
              if p.name.startswith("weather_personal_service") or p.name.startswith("personal_service"):
                  s = s.replace("https://earthweatherchannel.web.app", legal_routes["personal_service"])
              if p.name.startswith("weather_third_party_info"):
                  # Keep vendor disclosures truthful; route the app's legal entry point to EARTH WEATHER's data-use page.
                  s = s.replace("https://earthweatherchannel.web.app", legal_routes["third_party"])
              if s != original:
                  p.write_text(s, encoding="utf-8")

          # Keep the actual third-party SDK disclosures truthful; only remove obsolete OPPO ad-network branding.
          for p in root.rglob("*.json"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              s = s.replace('"OPPO","Realme"', '"EARTH WEATHER"')
              s = s.replace('"OPPO"', '"EARTH WEATHER"')
              p.write_text(s, encoding="utf-8")

          # Ensure the Android launcher label is ours in every locale.
          for p in (root / "res").glob("values*/strings.xml"):
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              s = re.sub(r'(<string\\s+name="app_name"[^>]*>).*?(</string>)',
                         r'\\1Earth Weather\\2', s, flags=re.S)
              p.write_text(s, encoding="utf-8")

          # Point every app-owned legal entry point to the published EARTH WEATHER website.
          legal_link_map = {
              "https://privacy.oppo.com": "https://earthweatherchannel.web.app/privacy-policy",
              "https://www.oppo.com/privacy": "https://earthweatherchannel.web.app/privacy-policy",
              "https://www.oppo.com": "https://earthweatherchannel.web.app",
              "https://oppo.com": "https://earthweatherchannel.web.app",
              "https://privacy.oppo.com/en/": "https://earthweatherchannel.web.app/privacy-policy",
              "https://privacy.oppo.com/en": "https://earthweatherchannel.web.app/privacy-policy",
          }
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              before = s
              for old_url, new_url in legal_link_map.items():
                  s = s.replace(old_url, new_url)
              if p.suffix.lower() == ".smali":
                  s = s.replace("https://earthweatherchannel.web.app/privacy-policy", "https://earthweatherchannel.web.app/privacy-policy")
                  s = s.replace("https://earthweatherchannel.web.app/terms-and-conditions", "https://earthweatherchannel.web.app/terms-and-conditions")
                  s = s.replace("https://earthweatherchannel.web.app/data-usage-policy", "https://earthweatherchannel.web.app/data-usage-policy")
              if p.name.startswith("weather_third_party_info") and p.suffix.lower() == ".html":
                  s = """<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Weather — Third-party information</title></head><body><h1>Earth Weather third-party information</h1><p>For the current third-party services, SDKs, data handling and privacy disclosures used by EARTH WEATHER, please read the published BMR INC. policy.</p><p><a href="https://earthweatherchannel.web.app/data-usage-policy">Earth Weather Data Usage & Third-party Information</a></p><p><a href="https://earthweatherchannel.web.app/privacy-policy">Earth Weather Privacy Policy</a></p></body></html>"""
              if s != before:
                  p.write_text(s, encoding="utf-8")

          # Preserve MIT/Open Source license notices; only rebrand app-specific legal pages and destinations.
          # Fail the build if an OPPO vendor privacy destination remains in visible app resources.
          visible_hits = []
          for base in (root / "res", root / "assets"):
              if not base.exists():
                  continue
              for p in base.rglob("*"):
                  if not p.is_file() or p.suffix.lower() not in text_ext:
                      continue
                  try:
                      body = p.read_text(encoding="utf-8")
                  except (UnicodeDecodeError, OSError):
                      continue
                  if re.search(r"(?i)Guangdong OPPO|oppo\\.com/privacy|privacy\\.oppo\\.com|ColorOS Weather|OPPO Weather", body):
                      visible_hits.append(str(p))
          if visible_hits:
              raise SystemExit("OPPO branding/privacy URLs remain in visible resources: " + ", ".join(visible_hits[:20]))

          # Record the intended product identity in the build workspace.
          (Path("earth-weather-build.properties")).write_text(
              "applicationId=com.bmrinc.earthweather\nappName=Earth Weather\napiBase=https://earth-weather-api.onrender.com\n"
          )
          print(f"Updated package references in {changed} files.")
          PY
      - name: Build original app resources and bytecode with Apktool
        run: |
          java -Xmx6g -jar apktool.jar b decoded -f -o earth-weather-unsigned.apk
          test -s earth-weather-unsigned.apk
          ls -lh earth-weather-unsigned.apk
      - name: Align and sign APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -v -keystore earthweather-debug.jks -storepass android -alias earthweather -keypass android -dname "CN=Earth Weather,O=BMR Inc,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f -p 4 earth-weather-unsigned.apk earth-weather-aligned.apk
          "$BT/apksigner" sign --ks earthweather-debug.jks --ks-key-alias earthweather --ks-pass pass:android --key-pass pass:android --out EarthWeather.apk earth-weather-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs EarthWeather.apk
          "$BT/aapt" dump badging EarthWeather.apk | tee apk-badging.txt
          grep -q "package: name='com.bmrinc.earthweather'" apk-badging.txt
          grep -q "application-label:'Earth Weather'" apk-badging.txt
          test "$(stat -c%s EarthWeather.apk)" -gt 20000000
          sha256sum EarthWeather.apk | tee apk-sha256.txt
      - name: Upload full UI APK
        uses: actions/upload-artifact@v4
        with:
          name: earth-weather-full-oppo-ui-debug
          path: |
            EarthWeather.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
