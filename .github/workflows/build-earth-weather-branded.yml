name: Build Earth Weather branded Android APK
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "Uifprweather.zip"
      - "scripts/rebrand_earth_weather.py"
      - "scripts/scan_earth_weather_apk.py"
      - ".github/workflows/build-earth-weather-branded.yml"
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    outputs:
      has_archive: ${{ steps.archive.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: archive
        shell: bash
        run: |
          if [[ -f Uifprweather.zip ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Android APK build: Uifprweather.zip is not committed to this repository."
          fi
  build-earth-weather:
    needs: source-check
    if: needs.source-check.outputs.has_archive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: "platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true
      - name: Download Apktool
        run: |
          curl -fL --retry 3 --retry-delay 2 https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o apktool.jar
          java -jar apktool.jar --version
      - name: Reconstruct and decode original UI UX package
        run: |
          mkdir -p input
          unzip -q Uifprweather.zip -d input
          test -f input/OppoWeather2/AndroidManifest.xml
          test -f input/OppoWeather2/resources.arsc
          test -f input/OppoWeather2/classes.dex
          (cd input/OppoWeather2 && zip -q -r ../oppo-original.apk .)
          java -Xmx5g -jar apktool.jar d -f input/oppo-original.apk -o decoded
      - name: Rebrand UI, legal references and disable inherited ad providers
        run: python3 scripts/rebrand_earth_weather.py
      - name: Build the preserved UI resources and application code
        run: |
          java -Xmx6g -jar apktool.jar b decoded -f -o earth-weather-unsigned.apk
          test -s earth-weather-unsigned.apk
          ls -lh earth-weather-unsigned.apk
      - name: Align and sign Earth Weather APK
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          keytool -genkeypair -v -keystore earthweather-debug.jks -storepass android -alias earthweather -keypass android -dname "CN=Earth Weather,O=BMR INC,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$BT/zipalign" -f -p 4 earth-weather-unsigned.apk earth-weather-aligned.apk
          "$BT/apksigner" sign --ks earthweather-debug.jks --ks-key-alias earthweather --ks-pass pass:android --key-pass pass:android --out EarthWeather.apk earth-weather-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs EarthWeather.apk
          "$BT/aapt" dump badging EarthWeather.apk | tee apk-badging.txt
          grep -q "package: name='com.bmrinc.earthweather'" apk-badging.txt
          grep -q "application-label:'Earth Weather'" apk-badging.txt
          test "$(stat -c%s EarthWeather.apk)" -gt 20000000
          sha256sum EarthWeather.apk | tee apk-sha256.txt
      - name: Scan APK for old vendor branding
        run: python3 scripts/scan_earth_weather_apk.py EarthWeather.apk
      - name: Upload branded Earth Weather APK
        uses: actions/upload-artifact@v4
        with:
          name: earth-weather-branded-oppo-ui-debug
          path: |
            EarthWeather.apk
            apk-badging.txt
            apk-sha256.txt
            brand-scan-report.json
          if-no-files-found: error
          retention-days: 14
