name: Decompile OPPO Weather classes
on:
  workflow_dispatch:
  push:
    paths:
      - "Uifprweather.zip"
      - ".github/workflows/decompile-oppo-java.yml"
permissions:
  contents: read
jobs:
  jadx-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reconstruct archive as APK
        run: |
          mkdir -p input
          unzip -q Uifprweather.zip -d input
          test -f input/OppoWeather2/AndroidManifest.xml
          test -f input/OppoWeather2/classes.dex
          (cd input/OppoWeather2 && zip -q -r ../oppo-original.apk .)
      - name: Download JADX
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip -o jadx.zip
          mkdir jadx-dist
          unzip -q jadx.zip -d jadx-dist
          find jadx-dist -path '*/bin/jadx' -type f -print -quit
      - name: Decompile DEX to Java for network and UI mapping
        run: |
          JADX="$(find "$PWD/jadx-dist" -path '*/bin/jadx' -type f -print -quit)"
          chmod +x "$JADX"
          "$JADX" --threads-count 4 -d jadx-out input/oppo-original.apk || true
          mkdir -p reports
          find jadx-out/sources -type f -name '*.java' | wc -l > reports/java-class-count.txt
          grep -R -l -E 'class WeatherDataClient|class WeatherSdkClient|class WeatherBaseHttp|class WeatherInfoDataSource|class WeatherMainActivity|class WeatherDataClientManager' jadx-out/sources > reports/key-java-files.txt || true
          grep -R -n -E '/weather/data/gzipJson|/weather/lightData|AES_GCM_NOPADDING_256|WeatherSdkClient.init' jadx-out/sources > reports/java-network-sites.txt || true
          grep -R -n -E 'class WeatherMainActivity|setContentView|R.layout.*weather' jadx-out/sources/com/oplus/weather > reports/main-ui-sites.txt || true
          test -s reports/java-class-count.txt
      - name: Upload decompiled source analysis
        uses: actions/upload-artifact@v4
        with:
          name: oppo-weather-java-analysis
          path: |
            jadx-out/sources/com/oplus/weather/
            jadx-out/sources/com/heytap/weather/
            reports/
          if-no-files-found: warn
          retention-days: 14
