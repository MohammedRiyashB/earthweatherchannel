services:
  - type: web
    name: earth-weather-api
    runtime: python
    branch: main
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: EARTH_WEATHER_USER_AGENT
        value: "EARTH-WEATHER/0.1 (replace-with-your-monitored-contact)"
      - key: CORS_ORIGINS
        value: "https://earthweatherchannel.web.app,https://earthweatherchannel.firebaseapp.com,https://earth-weather-web.onrender.com"

  - type: web
    name: earth-weather-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: earth-weather-api
          envVarKey: RENDER_EXTERNAL_URL
      # Firebase Web config is public client configuration; protect data with Firebase Security Rules.
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyDsIKBLzOwbIbw56XnjjpSpSkEenGLqwAo"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "earthweatherchannel.firebaseapp.com"
      - key: VITE_FIREBASE_DATABASE_URL
        value: "https://earthweatherchannel-default-rtdb.firebaseio.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "earthweatherchannel"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "earthweatherchannel.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "63892023947"
      - key: VITE_FIREBASE_APP_ID
        value: "1:63892023947:web:e02df1985db98b30a6c28e"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: "G-SBDSSMSNCT"
