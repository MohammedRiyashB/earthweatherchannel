services:
  - type: web
    name: earth-weather-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: EARTH_WEATHER_USER_AGENT
        value: "EARTH-WEATHER/0.1 (replace-with-your-monitored-contact)"

  - type: static
    name: earth-weather-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: earth-weather-api
          property: host
